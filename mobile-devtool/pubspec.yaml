name: mobile_devtool
description: Reusable Flutter SDK for non-production mobile developer tools.
publish_to: none
version: 0.8.0-dev.0

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter
  lucide_icons_flutter: ^3.1.15
  mobile_ui_kit:
    path: ../mobile_ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
