name: Verify workspace

on:
  pull_request:
  push:
    tags:
      - "*/v*"
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"

permissions:
  contents: read

jobs:
  ui-source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check visual tokens without compiling Flutter
        run: |
          python3 tool/verify_ui_tokens.py
          python3 -m unittest discover -s tool -p 'test_ui_tokens.py'
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flutter: ["3.50.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Format, analyze, and test every package
        run: ./tool/verify_workspace.sh
  package-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          cache: true
      - run: npm ci
      - run: npm run test:web
      - name: Analyze and test the web showcase
        working-directory: mobile_ui_kit/example
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build package portal and Flutter Web showcase
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: package-portal
          path: dist/
