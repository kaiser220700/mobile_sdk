name: mobile_sdk
description: Optional compatibility umbrella for existing shared Flutter integrations.
publish_to: none
version: 0.8.0-dev.0

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.6"

dependencies:
  mobile_sdk_core:
    path: ../mobile_sdk_core
  mobile_app_base:
    path: ../mobile_app_base
  mobile_ui_kit:
    path: ../mobile_ui_kit
  mobile_update:
    path: ../mobile_update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
